<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>User's Full Game Code</title>
    <style>
        /* Styles as previously defined/accumulated */
        #game-container { width: 80vw; height: 80vh; border: 1px solid black; position: relative; margin: auto; }
        #blue-rectangle {
            width: 90%; height: 60px; background-color: lightblue; position: absolute; bottom: 10px; left: 5%;
            display: flex; align-items: center; padding: 0 5px; box-sizing: border-box; border: 1px solid blue;
            overflow-x: auto; /* Allow scrolling if many squares */
        }
        .square-in-blue {
            width: 50px; height: 50px; border: 1px solid darkblue; margin: 2px; flex-shrink: 0;
            background-size: cover; background-position: center;
        }
        #lifted-squares-container {
            position: absolute; top: 10px; right: 10px; border: 1px solid green; padding: 5px;
            display: flex; gap: 3px; min-height: 25px;
        }
        /* End of user's other styles, start of new/updated styles for UI elements */

        #tasks-container {
            position: absolute;
            top: 15px;
            left: 15px;
            background-color: rgba(255, 255, 255, 0.85);
            padding: 8px 12px;
            border-radius: 8px;
            box-shadow: 0 3px 8px rgba(0, 0, 0, 0.15);
            z-index: 1000; /* High z-index */
            font-size: 14px;
            color: #333;
            font-weight: bold;
            display: none; /* Initially hidden, shown by JS */
        }

        #lifted-squares-container {
            position: absolute;
            top: 5px;
            right: 5px;
            display: flex;
            flex-direction: row-reverse;
            gap: 3px;
            z-index: 105;
            min-height: 25px;
            padding: 2px;
        }

        /* Style for squares placed in lifted-squares-container */
        #lifted-squares-container .square-in-blue {
            width: 22px; /* Smaller size for lifted squares */
            height: 22px;
            margin: 0;
            border-width: 1px;
            background-size: 70%; /* Adjust background size for smaller squares */
        }

        #tools-container {
            position: absolute;
            bottom: calc(15% - 85px);
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 5px;
            padding: 5px;
            background-color: rgba(0, 0, 0, 0.05);
            border-radius: 8px;
            z-index: 101;
        }

        .tool-square {
            width: 20px;
            height: 20px;
            border: 1px solid #777;
            border-radius: 4px;
            cursor: pointer;
            background-color: #e0e0e0; /* Placeholder if image fails */
            background-size: contain; /* Changed to contain for better icon visibility */
            background-position: center;
            background-repeat: no-repeat;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        .tool-square:hover {
            transform: scale(1.1);
            box-shadow: 0 0 5px rgba(0,0,0,0.3);
        }

        #squares-container { /* Main game area for squares */
            position: relative; width: calc(100% - 30px); height: 400px;
            border: 1px solid #ddd; margin: 15px; margin-top: 40px; /* Adjusted margin-top */
            overflow: hidden;
        }
        .game-square { /* Class for squares in the main game area */
            width: 50px; height: 50px; position: absolute; /* Important for positioning */
            border: 1px solid #555; background-color: #eee;
            background-size: cover; background-position: center;
            display: flex; justify-content: center; align-items: center; cursor: pointer;
        }
        .shake { animation: shake 0.4s; }
        @keyframes shake {
            0%, 100% { transform: translateX(0); } 25% { transform: translateX(-3px); } 75% { transform: translateX(3px); }
        }
    </style>
</head>
<body>
    <div id="game-container">
        <div id="tasks-container">
            <!-- Task information will be displayed here by JavaScript -->
        </div>
        <div id="squares-container"></div>
        <div id="blue-rectangle">
            <div id="lifted-squares-container">
                <!-- Lifted squares will be added here by JavaScript -->
            </div>
        </div>
        <div id="tools-container">
            <!-- Tool squares will be added here by JavaScript -->
        </div>
    </div>

    <script type="module">
        // --- User's Original Game Variables ---
        let gameStarted = false;
        let squares = [];
        let squaresInBlue = [];
        let removedSquaresCount = 0;
        // Tool-specific Globals
        let liftedSquares = [];
        let liftToolActive = false;
        const MAX_LIFTED_SQUARES = 3;
        let fingerToolActive = false;
        let lastMovedSquareForUndo = null;

        // Task System Globals
        const allGameTasks = [
            { id: 'collect_3_carrots', description: 'اجمع 3 جزرات', targetItemName: 'جزر', targetItemCount: 3, relatedImageUrl: 'https://i.imgur.com/prC9PT2.png' },
            { id: 'collect_3_milk', description: 'اجمع 3 حليب', targetItemName: 'حليب', targetItemCount: 3, relatedImageUrl: 'https://i.imgur.com/ifJb1W5.png' },
            { id: 'collect_2_gloves', description: 'اجمع قفازين', targetItemName: 'قفاز', targetItemCount: 2, relatedImageUrl: 'https://i.imgur.com/1UEmBN5.png' },
            { id: 'collect_3_cheese', description: 'اجمع 3 جبن', targetItemName: 'جبن', targetItemCount: 3, relatedImageUrl: 'https://i.imgur.com/nc8njcj.png' },
            { id: 'collect_2_hats', description: 'اجمع قبعتين', targetItemName: 'قبعة', targetItemCount: 2, relatedImageUrl: 'https://i.imgur.com/FHjeX0s.png' }
        ];
        let currentTask = null;
        let lastTaskGeneratedId = null;

        // --- Tool System Variables ---
        let allTools = [ // Ensuring this is populated as per current subtask spec
            { name: 'hammer', imageUrl: 'https://imgur.com/13YSjep.png', id: 'hammerTool', action: () => useHammerTool() },
            { name: 'shuffle', imageUrl: 'https://imgur.com/WViP2ZM.png', id: 'shuffleTool', action: () => useShuffleTool() },
            { name: 'lift', imageUrl: 'https://imgur.com/JS5HhHN.png', id: 'liftTool', action: () => useLiftTool() },
            { name: 'finger', imageUrl: 'https://imgur.com/ppwdNSP.png', id: 'fingerTool', action: () => useFingerTool() },
            { name: 'undo', imageUrl: 'https://imgur.com/W9tH4pn.png', id: 'undoTool', action: () => useUndoTool() }
        ];
        let currentGameTools = []; // Ensured definition
        let playerEarnedTools = {}; // Ensured definition
        // Other tool-specific state variables (liftedSquares, etc.) are already defined above.

        // --- User's Game Functions ---
        function displayMessage(message, type = 'info') { console.log(`UserMessage: [${type}] ${message}`); }
        function checkAndRemoveMatchingSquares() { console.log("User's checkAndRemoveMatchingSquares called."); }
        function updateGameProgress() { console.log("User's updateGameProgress called. Removed: " + removedSquaresCount); }
        function updateCoveredSquares() { console.log("User's updateCoveredSquares called."); }

        function createGameSquare(data, container) {
            const square = document.createElement('div');
            square.className = 'game-square';
            square.dataset.name = data.name;
            square.dataset.image = data.image;
            square.style.backgroundImage = `url(${data.image})`;
            square.style.left = data.left + 'px';
            square.style.top = data.top + 'px';
            square.style.zIndex = data.zIndex || '1';
            square.dataset.coveredBy = JSON.stringify(data.coveredBy || []);
            square.addEventListener('click', () => handleSquareClick(square)); // Removed index, pass only square
            container.appendChild(square);
            squares.push(square); // Add to main squares array
            return square;
        }

        function handleSquareClick(square) {
            // ADD THIS BLOCK AT THE VERY TOP:
            if (fingerToolActive) {
                console.log('Finger tool selection made on square:', square.dataset.name);
                if (typeof dropSquare === 'function') {
                    // The 'square' parameter in handleSquareClick is the DOM element from the game area.
                    // User's dropSquare expects (squareData, originalGameSquare)
                    const squareDataForDrop = { name: square.dataset.name, image: square.dataset.image };
                    dropSquare(squareDataForDrop, square);
                } else {
                    console.error('dropSquare function is not defined! Finger tool cannot move square.');
                }
                fingerToolActive = false; // Deactivate after one use
                const squaresContainer = document.getElementById('squares-container');
                if (squaresContainer) squaresContainer.style.cursor = ''; // Reset cursor
                return; // IMPORTANT: Prevents original logic from running when finger tool is used
            }
            // END OF ADDED BLOCK. User's original handleSquareClick logic follows:
            if (!gameStarted) return; // Original check
            const coveredBy = JSON.parse(square.dataset.coveredBy || '[]');
            if (coveredBy.length === 0) {
                const squareDataForDrop = { name: square.dataset.name, image: square.dataset.image };
                if (typeof dropSquare === 'function') dropSquare(squareDataForDrop, square);
            } else {
                square.classList.add('shake');
                setTimeout(() => square.classList.remove('shake'), 400);
            }
        }

        function dropSquare(squareData, originalGameSquare) {
            const blueRectangle = document.getElementById('blue-rectangle');
            if (!blueRectangle || squaresInBlue.length >= 7) return false;

            if (originalGameSquare && originalGameSquare instanceof HTMLElement) {
                // Capture state for Undo Tool (before hiding/modifying originalGameSquare)
                lastMovedSquareForUndo = {
                    element: originalGameSquare,
                    name: originalGameSquare.dataset.name,
                    image: originalGameSquare.dataset.image,
                    originalLeft: originalGameSquare.style.left,
                    originalTop: originalGameSquare.style.top,
                    originalZIndex: originalGameSquare.style.zIndex || '1' // Default zIndex if not set
                };
                console.log('Undo data captured for:', lastMovedSquareForUndo.name);
                // End Undo data capture

                originalGameSquare.style.display = 'none';
                removedSquaresCount++;
            } else { console.warn("dropSquare: originalGameSquare is not a valid DOM element or was not provided for an undoable move for Undo tool."); }

            const squareInBlue = document.createElement('div');
            squareInBlue.className = 'square-in-blue';
            squareInBlue.style.backgroundImage = `url(${squareData.image})`;
            squareInBlue.dataset.image = squareData.image;
            squareInBlue.dataset.name = squareData.name;
            blueRectangle.prepend(squareInBlue);
            squaresInBlue.unshift(squareInBlue);
            squareInBlue.addEventListener('click', function() { handleBlueSquareClick(this); });

            if(typeof updateGameProgress === 'function') updateGameProgress();

            if (currentTask && squareInBlue.dataset.name === currentTask.targetItemName) {
                currentTask.progress = (currentTask.progress || 0) + 1;
                displayCurrentTask();
                if (currentTask.progress >= currentTask.targetItemCount) {
                    if (typeof displayMessage === 'function') displayMessage(`🎉 مهمة مكتملة: ${currentTask.description}! 🎉`, 'success');
                    grantRandomToolReward();
                    setTimeout(generateRandomTask, 1500);
                }
            }
            return true;
        }

        // --- Tool Implementations ---
        function useLiftTool() {
            if (!gameStarted) return false; liftToolActive = !liftToolActive;
            if (liftToolActive) { if (typeof displayMessage === 'function') displayMessage('اختر حتى 3 مربعات لرفعها من الشريط الأزرق.', 'info');}
            else { if (typeof displayMessage === 'function') displayMessage('أداة الرفع معطلة.', 'info');} // Added deactivation message
            return true;
        }
        function handleBlueSquareClick(clickedBlueSquareElement) {
             if (liftToolActive && liftedSquares.length < MAX_LIFTED_SQUARES) {
                const liftedContainer = document.getElementById('lifted-squares-container'); if (!liftedContainer) return;
                const indexInBlue = squaresInBlue.findIndex(sq => sq === clickedBlueSquareElement); if (indexInBlue === -1) return;
                squaresInBlue.splice(indexInBlue, 1);
                const liftedSq = document.createElement('div'); liftedSq.className = 'square-in-blue';
                liftedSq.style.backgroundImage = clickedBlueSquareElement.style.backgroundImage;
                liftedSq.dataset.image = clickedBlueSquareElement.dataset.image; liftedSq.dataset.name = clickedBlueSquareElement.dataset.name;
                liftedContainer.appendChild(liftedSq); liftedSquares.push(liftedSq); clickedBlueSquareElement.remove();
                liftedSq.addEventListener('click', function() { handleLiftedSquareClick(this); });
                if (liftedSquares.length >= MAX_LIFTED_SQUARES) { liftToolActive = false; if (typeof displayMessage === 'function') displayMessage('تم رفع الحد الأقصى من المربعات.', 'info');}
            } else if (liftToolActive && liftedSquares.length >= MAX_LIFTED_SQUARES) { liftToolActive = false; if (typeof displayMessage === 'function') displayMessage('منطقة الرفع ممتلئة.', 'info');}
        }
        function handleLiftedSquareClick(clickedLiftedSquareElement) {
            if (squaresInBlue.length >= 7) { if (typeof displayMessage === 'function') displayMessage('الشريط الأزرق ممتلئ!', 'error'); return; }
            const blueRectangle = document.getElementById('blue-rectangle'); if (!blueRectangle) return;
            const indexInLifted = liftedSquares.findIndex(sq => sq === clickedLiftedSquareElement); if (indexInLifted === -1) return;
            liftedSquares.splice(indexInLifted, 1);
            const squareInBlue = document.createElement('div'); squareInBlue.className = 'square-in-blue';
            squareInBlue.style.backgroundImage = clickedLiftedSquareElement.style.backgroundImage;
            squareInBlue.dataset.image = clickedLiftedSquareElement.dataset.image; squareInBlue.dataset.name = clickedLiftedSquareElement.dataset.name;
            squareInBlue.style.opacity = '0'; squareInBlue.style.transform = 'scale(0.5)';
            blueRectangle.prepend(squareInBlue);  squaresInBlue.unshift(squareInBlue);
            squareInBlue.addEventListener('click', function() { handleBlueSquareClick(this); });
            setTimeout(() => { squareInBlue.style.opacity = '1'; squareInBlue.style.transform = 'scale(1)'; }, 10);
            clickedLiftedSquareElement.remove();
            if (typeof checkAndRemoveMatchingSquares === 'function') checkAndRemoveMatchingSquares();
        }
        function useFingerTool() {
            if (!gameStarted) {
                console.log('Finger tool: Game not started.');
                return false;
            }
            fingerToolActive = !fingerToolActive; // Toggle state

            const squaresContainer = document.getElementById('squares-container'); // For cursor style
            if (fingerToolActive) {
                console.log('Finger tool activated. Click any square in the game area.');
                if (typeof displayMessage === 'function') displayMessage('أداة الإصبع نشطة! اختر أي مربع من مساحة اللعب ليتم نقله.', 'info');
                if (squaresContainer) squaresContainer.style.cursor = 'crosshair';
            } else {
                console.log('Finger tool deactivated.');
                if (squaresContainer) squaresContainer.style.cursor = ''; // Reset cursor
            }
            return true; // Consumed upon mode activation/deactivation
        }

        function useUndoTool() {
            if (!gameStarted || !lastMovedSquareForUndo || !lastMovedSquareForUndo.element) {
                console.log('Undo tool: No valid action to undo or game not started.');
                const undoToolElement = document.getElementById('undoTool');
                if (undoToolElement) {
                    undoToolElement.classList.add('shake');
                    setTimeout(() => undoToolElement.classList.remove('shake'), 300);
                }
                return false; // No action taken
            }

            let undoneSquareInBlue = null;
            // Find the corresponding square in the blue bar.
            // User's dropSquare unshifts to squaresInBlue, so iterate from start to find newest.
            for (let i = 0; i < squaresInBlue.length; i++) {
                if (squaresInBlue[i].dataset.name === lastMovedSquareForUndo.name &&
                    squaresInBlue[i].dataset.image === lastMovedSquareForUndo.image) {
                    undoneSquareInBlue = squaresInBlue[i];
                    squaresInBlue.splice(i, 1); // Remove from array
                    undoneSquareInBlue.remove();    // Remove from DOM
                    break;
                }
            }

            if (!undoneSquareInBlue) {
                console.log('Undo tool: The square to undo was not found in the blue bar (e.g., already matched or cleared).');
                lastMovedSquareForUndo = null; // Clear stale data
                const undoToolElement = document.getElementById('undoTool');
                if (undoToolElement) {
                    undoToolElement.classList.add('shake');
                    setTimeout(() => undoToolElement.classList.remove('shake'), 300);
                }
                return false; // No effective action
            }

            // Restore the original square's visibility and position
            const squareToRestore = lastMovedSquareForUndo.element;
            squareToRestore.style.left = lastMovedSquareForUndo.originalLeft;
            squareToRestore.style.top = lastMovedSquareForUndo.originalTop;
            squareToRestore.style.zIndex = lastMovedSquareForUndo.originalZIndex;
            squareToRestore.style.display = ''; // Make it visible again (removes display:none)

            if (typeof removedSquaresCount !== 'undefined') {
                 removedSquaresCount--;
            }
            if (typeof updateGameProgress === 'function') {
                updateGameProgress();
            } else {
                console.warn('updateGameProgress function not found after undo.');
            }
            if (typeof updateCoveredSquares === 'function') {
                updateCoveredSquares();
            } else {
                console.warn('updateCoveredSquares function not found after undo.');
            }
            if (typeof checkGameEnd === 'function') {
                 checkGameEnd();
            }

            console.log('Undo tool used. Restored square:', lastMovedSquareForUndo.name);
            lastMovedSquareForUndo = null; // Prevent re-undoing the same action
            return true; // Tool consumed
        }

        function useHammerTool() {
            if (!gameStarted) {
                console.log('Hammer tool: Game not started.');
                return false;
            }

            let squaresRemovedByHammer = 0;
            const newSquaresArray = []; // To build the updated global 'squares' array

            for (let i = 0; i < squares.length; i++) {
                const square = squares[i];
                // Ensure square and square.style are valid before accessing square.style.display
                if (!square || !square.style) {
                    newSquaresArray.push(square); // Keep problematic square if it exists, or handle error
                    console.warn("Encountered a square without style property in useHammerTool", square);
                    continue;
                }

                if (square.style.display === 'none') {
                    newSquaresArray.push(square); // Keep already hidden squares
                    continue;
                }

                // Ensure square.dataset is valid before accessing square.dataset.coveredBy
                const coveredBy = JSON.parse(square.dataset && square.dataset.coveredBy ? square.dataset.coveredBy : '[]');

                if (coveredBy.length === 0) { // Check if the square is revealed
                    square.style.display = 'none';
                    removedSquaresCount++;
                    squaresRemovedByHammer++;
                    // Do not add to newSquaresArray, effectively removing it
                } else {
                    newSquaresArray.push(square); // Keep covered squares
                }
            }

            if (squaresRemovedByHammer > 0) {
                squares = newSquaresArray; // Update the global 'squares' array

                if (typeof updateGameProgress === 'function') {
                    updateGameProgress();
                } else {
                    console.warn('updateGameProgress function not found after hammer use.');
                }
                if (typeof updateCoveredSquares === 'function') {
                    updateCoveredSquares();
                } else {
                    console.warn('updateCoveredSquares function not found after hammer use.');
                }
                if (typeof checkGameEnd === 'function') { // Assuming checkGameEnd is a global function
                    checkGameEnd();
                } else {
                    console.warn('checkGameEnd function not found after hammer use.');
                }
                console.log(`Hammer tool used. ${squaresRemovedByHammer} revealed squares removed.`);
                return true; // Tool action was successful
            } else {
                console.log('Hammer tool: No revealed squares to remove.');
                return false; // No action taken, tool not consumed
            }
        }

        function useShuffleTool() {
            if (!gameStarted) {
                console.log('Shuffle tool: Game not started.');
                return false;
            }

            const squaresContainer = document.getElementById('squares-container');
            if (!squaresContainer) {
                console.error('Shuffle tool: squares-container not found!');
                return false;
            }

            // Filter for squares that are currently displayed and part of the game board
            const visibleGameSquares = squares.filter(s => s && s.style.display !== 'none' && s.parentElement === squaresContainer);

            if (visibleGameSquares.length === 0) {
                console.log('Shuffle tool: No visible squares to shuffle.');
                // Shake animation is handled by the click listener if action returns false
                return false;
            }

            const containerWidth = squaresContainer.clientWidth;
            const containerHeight = squaresContainer.clientHeight;

            visibleGameSquares.forEach(square => {
                const squareWidth = square.offsetWidth || 50;
                const squareHeight = square.offsetHeight || 50;

                const maxRandomX = Math.max(0, containerWidth - squareWidth);
                const maxRandomY = Math.max(0, containerHeight - squareHeight);

                const randomX = Math.floor(Math.random() * (maxRandomX + 1));
                const randomY = Math.floor(Math.random() * (maxRandomY + 1));

                square.style.left = randomX + 'px';
                square.style.top = randomY + 'px';
            });

            if (typeof updateCoveredSquares === 'function') {
                updateCoveredSquares();
            } else {
                console.error('updateCoveredSquares function is not defined! Shuffle may not work as expected.');
            }

            console.log('Shuffle tool used. Squares have been rearranged.');
            return true; // Tool action was successful
        }
        // Note: useLiftTool, useFingerTool, useUndoTool are more complete and remain untouched by this specific change.

        // --- Tool System Core Functions ---
        function selectRandomTools() {
            currentGameTools = [];
            const toolsCopy = [...allTools];
            for (let i = 0; i < 3; i++) {
                if (toolsCopy.length === 0) break;
                const randomIndex = Math.floor(Math.random() * toolsCopy.length);
                currentGameTools.push(toolsCopy.splice(randomIndex, 1)[0]);
            }
            console.log("Selected tools for this game:", currentGameTools.map(t => t.name));
        }

        function displayCurrentGameTools() {
            const toolsContainer = document.getElementById('tools-container');
            if (!toolsContainer) {
                console.error("Tools container #tools-container not found!");
                return;
            }
            toolsContainer.innerHTML = '';

            currentGameTools.forEach(tool => {
                const toolSquare = document.createElement('div');
                toolSquare.className = 'tool-square';
                toolSquare.id = tool.id;
                toolSquare.style.backgroundImage = `url(${tool.imageUrl})`;
                toolSquare.title = tool.name;

                const hasTool = playerEarnedTools[tool.name] && playerEarnedTools[tool.name] > 0;
                toolSquare.style.opacity = hasTool ? '1' : '0.5';
                toolSquare.style.cursor = hasTool ? 'pointer' : 'not-allowed';

                toolSquare.addEventListener('click', () => {
                    if (playerEarnedTools[tool.name] && playerEarnedTools[tool.name] > 0) {
                        const success = tool.action();
                        if (success) {
                            playerEarnedTools[tool.name]--;
                            console.log(`${tool.name} used. Remaining: ${playerEarnedTools[tool.name]}`);
                            const stillHasTool = playerEarnedTools[tool.name] > 0;
                            toolSquare.style.opacity = stillHasTool ? '1' : '0.5';
                            toolSquare.style.cursor = stillHasTool ? 'pointer' : 'not-allowed';
                            // Special cursor handling for finger tool deactivation on use
                            if (tool.name === 'finger' && fingerToolActive === false) {
                                if(document.getElementById('squares-container')) document.getElementById('squares-container').style.cursor = '';
                            }
                        } else {
                            console.log(`${tool.name} action was not successful or did nothing.`);
                            toolSquare.classList.add('shake');
                            setTimeout(() => toolSquare.classList.remove('shake'), 300);
                        }
                    } else {
                        console.log(`Tool ${tool.name} not available.`);
                        toolSquare.classList.add('shake');
                        setTimeout(() => toolSquare.classList.remove('shake'), 300);
                    }
                });
                toolsContainer.appendChild(toolSquare);
            });
        }
        // --- End Tool System Core Functions ---

        // Task System
        function grantRandomToolReward() {
            if (currentGameTools.length === 0) return;
            const randomToolIndex = Math.floor(Math.random() * currentGameTools.length);
            const rewardedTool = currentGameTools[randomToolIndex];
            if (rewardedTool && rewardedTool.name) {
                playerEarnedTools[rewardedTool.name] = (playerEarnedTools[rewardedTool.name] || 0) + 1;
                if (typeof displayMessage === 'function') displayMessage(`🎁 لقد حصلت على أداة: ${rewardedTool.name}! 🎁`, 'info');
                displayCurrentGameTools();
            }
        }
        function generateRandomTask() {
            if (allGameTasks.length === 0) { currentTask = null; displayCurrentTask(); return; }
            let availableTasks = allGameTasks;
            if (lastTaskGeneratedId && allGameTasks.length > 1) {
                availableTasks = allGameTasks.filter(task => task.id !== lastTaskGeneratedId);
                if(availableTasks.length === 0) availableTasks = allGameTasks;
            }
            const randomIndex = Math.floor(Math.random() * availableTasks.length);
            currentTask = { ...availableTasks[randomIndex], progress: 0 };
            lastTaskGeneratedId = currentTask.id;
            displayCurrentTask();
        }
        function displayCurrentTask() {
            const tasksContainer = document.getElementById('tasks-container'); if (!tasksContainer) return;
            if (currentTask) {
                let taskHTML = '';
                if (currentTask.relatedImageUrl) taskHTML += `<img src="${currentTask.relatedImageUrl}" alt="${currentTask.targetItemName}" style="width: 20px; height: 20px; margin-left: 5px; vertical-align: middle;"> `;
                taskHTML += `${currentTask.description} (${currentTask.progress || 0}/${currentTask.targetItemCount})`;
                tasksContainer.innerHTML = taskHTML; tasksContainer.style.display = 'block';
            } else { tasksContainer.innerHTML = ''; tasksContainer.style.display = 'none'; }
        }

        // --- Game Start and UI ---
        function preloadImages() { // New function
            console.log("Preloading all images (tools and tasks)...");
            allTools.forEach(tool => {
                if (tool.imageUrl) {
                    const image = new Image();
                    image.src = tool.imageUrl;
                }
            });
            allGameTasks.forEach(task => {
                if (task.relatedImageUrl) {
                     const image = new Image();
                     image.src = task.relatedImageUrl;
                }
            });
        }

        function startGame() {
            // Initialize tool system states:
            playerEarnedTools = {}; // Initialize/reset
            allTools.forEach(tool => {
                playerEarnedTools[tool.name] = 0;
            });
            // Note: selectRandomTools() and displayCurrentGameTools() calls are deferred as per overall plan.

            gameStarted = true;
            liftToolActive = false;
            // Finger Tool Reset Logic
            fingerToolActive = false;
            const squaresContainer = document.getElementById('squares-container');
            if (squaresContainer) squaresContainer.style.cursor = '';
            // End Finger Tool Reset Logic
            lastMovedSquareForUndo = null; // Reset for Undo tool
            if (Array.isArray(liftedSquares)) { liftedSquares.forEach(sq => { if (sq && sq.remove) sq.remove(); });}
            liftedSquares = [];
            const liftedContainerDOM = document.getElementById('lifted-squares-container');
            if (liftedContainerDOM) liftedContainerDOM.innerHTML = '';
            const sqContainer = document.getElementById('squares-container');
            if(sqContainer) sqContainer.style.cursor = '';

            currentTask = null; lastTaskGeneratedId = null; generateRandomTask();

            squares.forEach(sq => sq.remove()); squares = [];
            squaresInBlue.forEach(sq => sq.remove()); squaresInBlue = [];
            removedSquaresCount = 0;

            selectRandomTools();
            allTools.forEach(tool => playerEarnedTools[tool.name] = 0); // Reset earned tools
            // For testing, grant one of each *selected* tool
            currentGameTools.forEach(tool => playerEarnedTools[tool.name] = 1);
            displayCurrentGameTools();
            if(typeof updateGameProgress === 'function') updateGameProgress();

            // Example: Populate #squares-container
            if(sqContainer) { // Check if sqContainer is not null
                sqContainer.innerHTML = ''; // Clear previous squares from game area
                createGameSquare({ name: 'جزر', image: 'https://i.imgur.com/prC9PT2.png', left: 10, top: 10, coveredBy: []}, sqContainer);
                createGameSquare({ name: 'حليب', image: 'https://i.imgur.com/ifJb1W5.png', left: 70, top: 10, coveredBy: []}, sqContainer);
                createGameSquare({ name: 'جزر', image: 'https://i.imgur.com/prC9PT2.png', left: 130, top: 10, coveredBy: []}, sqContainer);
                 createGameSquare({ name: 'جزر', image: 'https://i.imgur.com/prC9PT2.png', left: 10, top: 70, coveredBy: []}, sqContainer);
                createGameSquare({ name: 'قفاز', image: 'https://i.imgur.com/1UEmBN5.png', left: 70, top: 70, coveredBy: []}, sqContainer);

            }
        }
        function selectRandomTools() {
            currentGameTools = []; const toolsCopy = [...allTools];
            for (let i = 0; i < 3; i++) { if (toolsCopy.length === 0) break; const ri = Math.floor(Math.random() * toolsCopy.length); currentGameTools.push(toolsCopy.splice(ri, 1)[0]);}
        }
        function displayCurrentGameTools() {
            const tc = document.getElementById('tools-container'); if (!tc) return; tc.innerHTML = '';
            currentGameTools.forEach(t => {const ts = document.createElement('div'); ts.className = 'tool-square'; ts.id = t.id; ts.style.backgroundImage = `url(${t.imageUrl})`; ts.title = t.name;
            ts.addEventListener('click', () => { if (playerEarnedTools[t.name] > 0) {const s = t.action(); if(s){playerEarnedTools[t.name]--; ts.style.opacity = playerEarnedTools[t.name] > 0 ? '1':'0.5'; if(t.name === 'finger' && fingerToolActive === false){if(document.getElementById('squares-container')) document.getElementById('squares-container').style.cursor = '';} else if(t.name === 'finger' && fingerToolActive === true){if(document.getElementById('squares-container')) document.getElementById('squares-container').style.cursor = 'crosshair';} }} else {ts.classList.add('shake'); setTimeout(()=>ts.classList.remove('shake'),400);}});
            ts.style.opacity = playerEarnedTools[t.name] > 0 ? '1' : '0.5'; tc.appendChild(ts);});
        }

        document.addEventListener('DOMContentLoaded', startGame);
    </script>
</body>
</html>
