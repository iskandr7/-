<!DOCTYPE html>

        .square { position: absolute; width: 12vw; max-width: 60px; height: 12vw; max-height: 60px; border-radius: 12px; cursor: pointer; transition: all 0.2s cubic-bezier(0.25, 0.8, 0.25, 1); z-index: 1; box-shadow: 3px 3px 10px rgba(0,0,0,0.3); border: 3px solid rgba(255,255,255,0.4); background-size: 80%; background-repeat: no-repeat; background-position: center; background-color: var(--card-color); transform-origin: center; will-change: transform, opacity; backface-visibility: hidden; perspective: 1000px; touch-action: manipulation; }
        .square::before { content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: linear-gradient(135deg, rgba(255,255,255,0.4) 0%, rgba(255,255,255,0) 50%); border-radius: 9px; pointer-events: none; }

        #start-button:hover { transform: translate(-50%, -50%) scale(1.08); box-shadow: 0 15px 25px rgba(0,0,0,0.4); background: linear-gradient(145deg, #ff8a2c 0%, #ff5b5b 100%); }

        #profile-button:hover { transform: translate(-50%, -50%) scale(1.05); box-shadow: 0 12px 20px rgba(0,0,0,0.3); background: linear-gradient(145deg, #3a5f94 0%, #4a6fa5 100%); }

        .profile-screen { position: absolute; top: 0; left: 0; right: 0; bottom: 0; background: linear-gradient(135deg, #f5e8d0 0%, #e8d9b5 100%); z-index: 2000; display: none; flex-direction: column; justify-content: center; align-items: center; padding: 20px; }

        .back-button { background: var(--primary-color); color: white; border: none; padding: 10px 20px; border-radius: 10px; cursor: pointer; font-weight: bold; margin-top: 20px; align-self: center; transition: all 0.3s; }
        .back-button:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,0,0,0.2); }

        #player-name-display { font-size: 18px; font-weight: 700; color: #333; text-shadow: 1px 1px 2px rgba(0,0,0,0.1); }
        #exit-button { position: absolute; top: 5%; left: 5%; background: none; color: #333; border: none; padding: 10px; border-radius: 50%; font-size: 24px; cursor: pointer; box-shadow: 0 3px 10px rgba(0,0,0,0.1); z-index: 100; display: none; width: 40px; height: 40px; justify-content: center; align-items: center; transition: all 0.3s; }
        #exit-button:hover { background: rgba(0,0,0,0.1); transform: translateY(-2px); }
        #win-screen { text-align: center; }
        #win-screen h2 { margin-bottom: 5px; }
        #win-screen p.time-label { margin-top: 15px; font-weight: bold; color: var(--primary-color); font-size: 18px; }
        #win-screen p.time-value { font-size: 24px; color: #333; margin-bottom: 20px; font-weight: bold; }
        #play-again-button { background: linear-gradient(145deg, #4CAF50 0%, #2E7D32 100%); margin-bottom: 10px; }
        #play-again-button:hover { background: linear-gradient(145deg, #3a8c3f 0%, #1B5E20 100%); }
        @media (min-width: 768px) { .square, .square-in-blue { width: 55px; height: 55px; } #start-button { font-size: 28px; padding: 22px 50px; } #profile-button, #leaderboard-button { font-size: 22px; padding: 18px 36px; } #win-screen h2, #lose-screen h2 { font-size: 36px; } button { font-size: 22px; padding: 18px 36px; } #squares-container { max-width: 400px; max-height: 550px; } }
    </style>

<body>
    <div id="game-container">
        <div class="main-menu" id="main-menu">
            <h1 class="game-title">جمل مجنون</h1>
            <button id="google-signin-button" class="bg-blue-500 hover:bg-blue-700 text-white font-bold py-3 px-6 rounded-lg text-xl shadow-md hover:shadow-lg transition-all duration-150 ease-in-out mb-4">تسجيل الدخول بواسطة جوجل</button>

    </div>
    <script type="module">
    // Firebase SDK imports
    import { initializeApp } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-auth.js";
    import { getFirestore, collection, getDocs, addDoc, query, orderBy, limit, where, doc, updateDoc, serverTimestamp, deleteDoc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore.js"; // Added getDoc, setDoc

    // User's Firebase configuration
    const firebaseConfig = {
      apiKey: "AIzaSyDDC6Ux27mPtu4Fn1rGgqyuC0uD3PrmGPs", // Replace with your actual API key if necessary, but for this task, we assume it's correct.
      authDomain: "skloz-9392f.firebaseapp.com",
      projectId: "skloz-9392f",
      storageBucket: "skloz-9392f.firebasestorage.app",
      messagingSenderId: "457319200318",
      appId: "1:457319200318:web:97321b2df3532796b6836f",
      measurementId: "G-LBEE8GNWZM"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app); // Initialize Firebase Auth
    window.db = db;
    window.auth = auth; // Expose auth instance globally
    window.fb = { 
        collection, getDocs, addDoc, query, orderBy, limit, where, doc, updateDoc, serverTimestamp, deleteDoc, getDoc, setDoc, // Added getDoc, setDoc
        GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged 
    };

    const images = [
        { name: 'جوهرة', url: 'https://i.imgur.com/AjPTyZC.png' }, { name: 'نعناع', url: 'https://i.imgur.com/O3nvXac.png' },
        { name: 'حليب', url: 'https://i.imgur.com/ifJb1W5.png' }, { name: 'جزر', url: 'https://i.imgur.com/prC9PT2.png' },
        { name: 'قفاز', url: 'https://i.imgur.com/1UEmBN5.png' }, { name: 'جورب', url: 'https://i.imgur.com/cV25GC9.png' },
        { name: 'جبن', url: 'https://i.imgur.com/nc8njcj.png' }, { name: 'لحم', url: 'https://i.imgur.com/jQvWLPZ.png' },
        { name: 'قطن', url: 'https://i.imgur.com/VcJHy4z.png' }, { name: 'قبعة', url: 'https://i.imgur.com/FHjeX0s.png' }
    ];

    function preloadImages() { images.forEach(img => { const image = new Image(); image.src = img.url; }); }
    function getCurrentKsaDateString() {
        const now = new Date(); const ksaTime = new Date(now.getTime() + (3 * 60 * 60 * 1000));
        const year = ksaTime.getUTCFullYear(); const month = (ksaTime.getUTCMonth() + 1).toString().padStart(2, '0');
        const day = ksaTime.getUTCDate().toString().padStart(2, '0'); return `${year}-${month}-${day}`;
    }
    function isLocalStorageAvailable() {
        let storage; try { storage = window.localStorage; const x = '__storage_test__'; storage.setItem(x, x); storage.removeItem(x); return true; }
        catch (e) { return e instanceof DOMException && (e.code === 22 || e.code === 1014 || e.name === 'QuotaExceededError' || e.name === 'NS_ERROR_DOM_QUOTA_REACHED') && (storage && storage.length !== 0); }
    }
    let squares = []; let squaresInBlue = []; let gameStarted = false; let startTime; let timerInterval;
    let playerName = localStorage.getItem('playerName') || ''; 
    let playerAvatar = localStorage.getItem('playerAvatar') || 'https://i.imgur.com/8Km9tLL.png'; 
    let leaderboard = [];
    let isWinProcessed = false;
    let userDisplayId = ''; // Global variable for 6-digit user ID
    window.userDisplayId = userDisplayId; // Also expose on window for potential access if needed

    async function loadLeaderboardData() {
        const currentKsaDate = getCurrentKsaDateString();
        console.log(`[loadLeaderboardData] Attempting to load for KSA Date: ${currentKsaDate}`);
        const dailyScores = [];
        try {
            const scoresCol = fb.collection(db, 'leaderboard_scores');
            const q = fb.query(scoresCol,
                fb.where('ksaDate', '==', currentKsaDate),
                fb.orderBy('scoreTime', 'asc'),
                fb.limit(10));

            console.log("[loadLeaderboardData] Scores query constructed. Fetching score documents...");
            const scoreQuerySnapshot = await fb.getDocs(q);
            console.log(`[loadLeaderboardData] Score query snapshot received. Size: ${scoreQuerySnapshot.size}`);

            if (scoreQuerySnapshot.empty) {
                console.log("[loadLeaderboardData] No scores found for this date.");
                leaderboard = [];
                return [];
            }

            // Create an array of promises to fetch user data for each score
            const userFetchPromises = scoreQuerySnapshot.docs.map(scoreDoc => {
                const scoreData = scoreDoc.data();
                const userId = scoreData.userId;

                if (!userId) {
                    console.warn(`[loadLeaderboardData] Score document ${scoreDoc.id} is missing userId. Skipping user data fetch, will use defaults.`);
                    // Return a resolved promise with an object indicating missing user data but including score data
                    return Promise.resolve({ 
                        scoreData: scoreData, 
                        scoreId: scoreDoc.id, 
                        userDataMissing: true 
                    });
                }
                const userDocRef = fb.doc(db, 'users', userId);
                return fb.getDoc(userDocRef).then(userDocSnap => ({
                    scoreData: scoreData,
                    scoreId: scoreDoc.id,
                    userDocSnap: userDocSnap,
                    userId: userId // Pass userId along for context if userDocSnap doesn't exist
                })).catch(error => {
                    console.error(`[loadLeaderboardData] Error fetching user document for userId ${userId}:`, error);
                    return { 
                        scoreData: scoreData, 
                        scoreId: scoreDoc.id, 
                        userDataMissing: true, 
                        fetchError: true 
                    }; // Indicate error and missing data
                });
            });

            const resolvedUserDocs = await Promise.all(userFetchPromises);

            resolvedUserDocs.forEach(result => {
                const { scoreData, scoreId, userDocSnap, userId, userDataMissing, fetchError } = result;
                
                if (userDataMissing || fetchError) {
                     console.warn(`[loadLeaderboardData] User document not found or error for userId: ${userId || 'Unknown'}. Score ${scoreId} will use defaults.`);
                    dailyScores.push({
                        id: scoreId,
                        playerName: 'Anonymous User',
                        playerAvatar: 'https://i.imgur.com/8Km9tLL.png',
                        displayId: '??????',
                        scoreTime: scoreData.scoreTime,
                        ksaDate: scoreData.ksaDate
                    });
                } else if (userDocSnap && userDocSnap.exists()) {
                    const userData = userDocSnap.data();
                    dailyScores.push({
                        id: scoreId,
                        playerName: userData.displayName || 'Unknown Player',
                        playerAvatar: userData.avatarUrl || 'https://i.imgur.com/8Km9tLL.png',
                        displayId: userData.displayId || '000000',
                        scoreTime: scoreData.scoreTime,
                        ksaDate: scoreData.ksaDate,
                        userId: userId // Optionally include for debugging or other UI needs
                    });
                } else { // Should ideally be caught by userDataMissing or fetchError, but as a fallback
                    console.warn(`[loadLeaderboardData] User document not found for userId: ${userId}. Score ${scoreId} will use defaults (fallback).`);
                    dailyScores.push({
                        id: scoreId,
                        playerName: 'Anonymous User (Fallback)',
                        playerAvatar: 'https://i.imgur.com/8Km9tLL.png',
                        displayId: '??????',
                        scoreTime: scoreData.scoreTime,
                        ksaDate: scoreData.ksaDate
                    });
                }
            });
            
            // Re-sort dailyScores by scoreTime as Promise.all might not guarantee order if some promises resolve faster or if errors occur.
            // Actually, Promise.all *does* preserve the order of the input promises array.
            // So, if the initial scoreQuerySnapshot.docs were already sorted by scoreTime, this re-sort is redundant.
            // The initial query includes orderBy('scoreTime', 'asc'), so this should be fine.
            // dailyScores.sort((a, b) => a.scoreTime - b.scoreTime);


            console.log('[loadLeaderboardData] Assembled dailyScores with user data:', JSON.stringify(dailyScores));
            leaderboard = dailyScores;
            return dailyScores;

        } catch (error) {
            console.error('[loadLeaderboardData] General error loading leaderboard:', error.message);
            console.error('[loadLeaderboardData] Full error object:', error);
            leaderboard = [];
            return [];
        }
    }
    
    async function handleUserFirstLogin(firebaseUser) {
        if (!firebaseUser) return;
        console.log("[handleUserFirstLogin] Called for user:", firebaseUser.uid);
        const userDocRef = fb.doc(db, 'users', firebaseUser.uid);
        try {
            const userDocSnap = await fb.getDoc(userDocRef);

            if (userDocSnap.exists()) {
                console.log("[handleUserFirstLogin] Existing user data found:", userDocSnap.data());
                const userData = userDocSnap.data();
                playerName = userData.displayName || firebaseUser.displayName || 'اللاعب';
                playerAvatar = userData.avatarUrl || firebaseUser.photoURL || 'https://i.imgur.com/8Km9tLL.png';
                window.userDisplayId = userData.displayId; // Store the 6-digit ID globally
                userDisplayId = userData.displayId; // Keep local global in sync
                console.log("[handleUserFirstLogin] User displayId:", window.userDisplayId);

                const updatedData = {};
                if (firebaseUser.displayName && firebaseUser.displayName !== userData.displayName) {
                    updatedData.displayName = firebaseUser.displayName;
                }
                if (firebaseUser.photoURL && firebaseUser.photoURL !== userData.avatarUrl) {
                    updatedData.avatarUrl = firebaseUser.photoURL;
                }
                // Also update email if it has changed - good practice
                if (firebaseUser.email && firebaseUser.email !== userData.email) {
                    updatedData.email = firebaseUser.email;
                }

                if (Object.keys(updatedData).length > 0) {
                    console.log("[handleUserFirstLogin] Updating user profile in Firestore with new Google data:", updatedData);
                    await fb.updateDoc(userDocRef, updatedData);
                }
            } else {
                console.log("[handleUserFirstLogin] New user. Creating profile in Firestore.");
                let newDisplayId;
                let idIsUnique = false;
                while (!idIsUnique) {
                    newDisplayId = Math.floor(100000 + Math.random() * 900000).toString();
                    const q = fb.query(fb.collection(db, 'users'), fb.where('displayId', '==', newDisplayId));
                    const querySnapshot = await fb.getDocs(q);
                    idIsUnique = querySnapshot.empty;
                    console.log("[handleUserFirstLogin] Generated displayId:", newDisplayId, "Unique:", idIsUnique);
                }

                const newUserProfile = {
                    displayName: firebaseUser.displayName || 'اللاعب',
                    avatarUrl: firebaseUser.photoURL || 'https://i.imgur.com/8Km9tLL.png',
                    displayId: newDisplayId,
                    email: firebaseUser.email,
                    createdAt: fb.serverTimestamp()
                };
                await fb.setDoc(userDocRef, newUserProfile);
                console.log("[handleUserFirstLogin] New user profile created in Firestore with displayId:", newDisplayId);
                playerName = newUserProfile.displayName;
                playerAvatar = newUserProfile.avatarUrl;
                window.userDisplayId = newDisplayId;
                userDisplayId = newDisplayId; // Keep local global in sync
            }
        } catch (error) {
            console.error("[handleUserFirstLogin] Error processing user login:", error);
            // Fallback to Google's direct info or defaults if Firestore interaction fails
            playerName = firebaseUser.displayName || 'اللاعب';
            playerAvatar = firebaseUser.photoURL || 'https://i.imgur.com/8Km9tLL.png';
        }
        // Update UI elements that might not be covered by toggleUIBasedOnAuthState, or to ensure they reflect Firestore data
        const playerNameInput = document.getElementById('player-name');
        if (playerNameInput) playerNameInput.value = playerName;
        const avatarPreview = document.getElementById('avatar-preview');
        if (avatarPreview) avatarPreview.innerHTML = `<img src="${playerAvatar}" alt="صورة اللاعب">`;
        
        // Persist latest to localStorage after handling Firestore.
        localStorage.setItem('playerName', playerName);
        localStorage.setItem('playerAvatar', playerAvatar);
    }

    function toggleUIBasedOnAuthState(isLoggedIn, user) {
        const googleSignInButton = document.getElementById('google-signin-button');
        const signInMessage = document.getElementById('signin-message');
        const startButton = document.getElementById('start-button');
        const profileButton = document.getElementById('profile-button');
        const leaderboardButton = document.getElementById('leaderboard-button');
        const signOutButton = document.getElementById('signout-button');
        const playerInfoDiv = document.getElementById('player-info');
        const playerNameDisplay = document.getElementById('player-name-display');
        const playerAvatarImg = document.getElementById('player-avatar');
        const defaultAvatar = 'https://i.imgur.com/8Km9tLL.png';

        if (isLoggedIn && user) { // Ensure user object is present
            if (googleSignInButton) googleSignInButton.style.display = 'none';
            if (signInMessage) signInMessage.style.display = 'none';
            if (startButton) startButton.style.display = 'block';
            if (profileButton) profileButton.style.display = 'block'; 
            if (leaderboardButton) leaderboardButton.style.display = 'block';
            if (signOutButton) signOutButton.style.display = 'block';
            if (playerInfoDiv) playerInfoDiv.style.display = 'flex';
            
            // These are updated by handleUserFirstLogin from Firestore or Google profile
            // playerName = user.displayName || 'اللاعب'; 
            // playerAvatar = user.photoURL || defaultAvatar;
            // localStorage.setItem('playerName', playerName); 
            // localStorage.setItem('playerAvatar', playerAvatar);

            if (playerNameDisplay) playerNameDisplay.textContent = playerName; // Will be set by handleUserFirstLogin
            if (playerAvatarImg) playerAvatarImg.src = playerAvatar; // Will be set by handleUserFirstLogin

        } else {
            if (googleSignInButton) googleSignInButton.style.display = 'block';
            if (signInMessage) signInMessage.style.display = 'block';
            if (startButton) startButton.style.display = 'none';
            if (profileButton) profileButton.style.display = 'none';
            if (leaderboardButton) leaderboardButton.style.display = 'none';
            if (signOutButton) signOutButton.style.display = 'none';
            if (playerInfoDiv) playerInfoDiv.style.display = 'none';

            playerName = '';
            playerAvatar = defaultAvatar; 
            userDisplayId = ''; // Reset global displayId
            window.userDisplayId = ''; 
            localStorage.removeItem('playerName'); 
            localStorage.removeItem('playerAvatar');

            if (playerNameDisplay) playerNameDisplay.textContent = 'اللاعب'; 
            if (playerAvatarImg) playerAvatarImg.src = defaultAvatar; 
        }
    }

    function initAuthObserver() {
        fb.onAuthStateChanged(auth, async (user) => { // Made async
            if (user) {
                console.log("User is signed in:", user.uid, user.displayName);
                await handleUserFirstLogin(user); // Ensure this completes
                toggleUIBasedOnAuthState(true, user); // Then update UI
            } else {
                console.log("User is signed out.");
                toggleUIBasedOnAuthState(false, null);
            }
        });
    }
